# gitleaks config: the default rules, plus the redaction tests' fixtures.
# Those tests must hold credential-shaped values to prove they are removed;
# every value is made up.
[extend]
useDefault = true

[[allowlists]]
description = "redaction test fixtures (fake keys)"
paths = [
  '''^pkg/redact/redact_test\.go$''',
  '''^pkg/redact/fieldname_test\.go$''',
]
