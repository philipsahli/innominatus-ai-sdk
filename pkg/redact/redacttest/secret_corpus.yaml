# Secret corpus: fake credentials of the kinds that reach a model prompt
# through instructions, configuration, a description or a request.
# redact.Prompt must remove every `secrets` entry from every `text`
# (TestPromptCorpus in package redact). Corpus() serves the entries to
# callers that check their own prompt path.
#
# Every value is made up. Each one is split by "<cut>", which Corpus()
# removes, so the file itself matches no scanner rule (gitleaks, GitHub
# push protection) and the shapes stay real at run time.
#
# text:    what lands in the prompt, as a person would paste it
# secrets: distinctive substrings that must not reach the model

