name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      # Fail instead of downloading a newer toolchain, so every module must build with the go.mod version
      GOTOOLCHAIN: local

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Run gofmt
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted:"
          gofmt -d .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Check test coverage
      run: |
        go tool cover -func=coverage.out
        # Calculate total coverage
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        # Note: Currently allowing <80% until tests are added
        # Uncomment below to enforce 80% threshold:
        # if (( $(echo "$COVERAGE < 80" | bc -l) )); then
        #   echo "Coverage ${COVERAGE}% is below 80% threshold"
        #   exit 1
        # fi

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-report
        path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.15.0
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: go.mod

    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.30.0
      with:
        args: '-no-fail -fmt json -out gosec-report.json ./...'

    - name: Upload security report
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: security-report
        path: gosec-report.json

  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      # Fail instead of downloading a newer toolchain, so every module must build with the go.mod version
      GOTOOLCHAIN: local

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Build examples
      run: |
        cd examples/code-analyzer && go build
        cd ../rag-demo && go build
        cd ../..

    - name: Build verification scripts
      run: |
        cd verification/codemapping && go build
        cd ../rag && go build
        cd ../..

    - name: Check build outputs are ignored
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          exit 1
        fi
